// Owner-private durable command format. Published integration contracts remain separate.
syntax = "proto3";
package cafe.internal.communication;
import "cafe/requests/v1/validation.proto";
message CommandEnvelope {
  string id = 1;
  string consumer = 2;
  string source_event_id = 3;
  string source_hash = 4;
  string target = 5;
  string correlation_id = 6;
  // Original receipt material preserves deduplication across the hand-off.
  bytes receipt_material = 7;
  oneof command {
    RequestNotificationCommand request_notification = 10;
    DeliverNotificationCommand deliver_notification = 11;
  }
}
message RequestNotificationCommand {
  option (cafe.requests.v1.contract) = { owner: "communication" visibility: PRIVATE response: "cafe.requests.v1.Outcome" };
  string recipient = 1; string subject = 2; string body = 3; }
message DeliverNotificationCommand {
  option (cafe.requests.v1.contract) = { owner: "communication" visibility: PRIVATE response: "cafe.requests.v1.Outcome" };
  string notification_id = 1; }
