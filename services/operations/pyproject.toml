[project]
name = "cafe-operations"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "pika==1.4.4",
  "protobuf==7.36.2",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-bdd==8.1.0",
    "ruff==0.16.9",
    "types-pika==1.2.0b1",
    "types-protobuf==7.35.1.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/operations"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["src/operations/adaptors/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
exclude = ["^src/operations/adaptors/generated/"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
warn_unreachable = true
enable_error_code = ["ignore-without-code"]
