name: Verify reference
on:
  pull_request:
  push:
    branches: [main]
env:
  CAFE_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'caa3206' }}
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/*/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.19'
          python-version: '3.14'
      - name: Install frozen workspace dependencies
        run: |
          npm install --global pnpm@10.34.5
          pnpm install --frozen-lockfile
      - name: Verify all five applications and fast Gherkin scenarios
        run: pnpm verify
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/*/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.19'
          python-version: '3.14'
      - name: Install frozen workspace dependencies
        run: |
          npm install --global pnpm@10.34.5
          pnpm install --frozen-lockfile
      - name: Real persistence, broker, Gherkin workflows, recovery and browser
        run: pnpm test:integration
