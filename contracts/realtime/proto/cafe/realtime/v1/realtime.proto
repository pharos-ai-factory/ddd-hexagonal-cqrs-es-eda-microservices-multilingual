syntax = "proto3";
package cafe.realtime.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/realtime/generated/cafe/realtime/v1;realtimev1";

// Browser projections have their own contract, independently of domain delivery.
// Revision orders one aggregate; Centrifugo epoch/offset orders channel history.
message Publication {
  string event_id = 1;
  uint32 contract_version = 2;
  string context = 3;
  string aggregate_kind = 4;
  string aggregate_id = 5;
  uint64 revision = 6;
  oneof snapshot {
    Drink drink = 10;
    Edition edition = 11;
    Order order = 12;
    Ticket ticket = 13;
    Pickup pickup = 14;
    Account account = 15;
    Reward reward = 16;
    Notification notification = 17;
  }
}
message Drink { string id = 1; string name = 2; uint64 revision = 3; bool published = 4; }
message Offer { string code = 1; string drink_id = 2; uint64 drink_revision = 3; string name = 4; int64 minor = 5; string currency = 6; }
message Edition { string id = 1; string currency = 2; string status = 3; repeated Offer offers = 4; }
message Selection { string offer_code = 1; string name = 2; int64 minor = 3; }
message Line { string id = 1; Selection selection = 2; int32 quantity = 3; }
message Order { string id = 1; string customer_id = 2; string edition_id = 3; string currency = 4; string status = 5; repeated Line lines = 6; }
message Ticket { string id = 1; string order_id = 2; string customer_id = 3; string instructions = 4; string status = 5; }
message Pickup { string id = 1; string order_id = 2; string customer_id = 3; string code = 4; string status = 5; }
message Grant { string id = 1; string account_id = 2; string benefit = 3; int32 valid_days = 4; }
message Account { string id = 1; int32 stamp_balance = 2; int32 collections = 3; int32 grants_earned = 4; Grant last_grant = 5; }
message Reward { string id = 1; string grant_id = 2; string customer_id = 3; string benefit = 4; string status = 5; string expires_at = 6; string redeemed_for = 7; }
message Notification { string id = 1; string recipient = 2; string subject = 3; string body = 4; string status = 5; string provider_receipt = 6; }
