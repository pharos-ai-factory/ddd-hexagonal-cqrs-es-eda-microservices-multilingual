syntax = "proto3";
package cafe.menu.requests.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/requests/generated/cafe/requests/v1/contexts/menu;menuv1";

import "cafe/requests/v1/common.proto";

import "cafe/requests/v1/validation.proto";

message ListDrinks {
  option (cafe.requests.v1.contract) = { owner: "menu" visibility: PUBLIC response: "cafe.menu.requests.v1.Drinks" };
  cafe.requests.v1.PageRequest page = 1;
}

message GetDrink {
  option (cafe.requests.v1.contract) = { owner: "menu" visibility: PUBLIC response: "cafe.menu.requests.v1.LoadedDrink" };
  string id = 1;
}

message ListEditions {
  option (cafe.requests.v1.contract) = { owner: "menu" visibility: PUBLIC response: "cafe.menu.requests.v1.Editions" };
  cafe.requests.v1.PageRequest page = 1;
}

message GetEdition {
  option (cafe.requests.v1.contract) = { owner: "menu" visibility: PUBLIC response: "cafe.menu.requests.v1.LoadedEdition" };
  string id = 1;
}
