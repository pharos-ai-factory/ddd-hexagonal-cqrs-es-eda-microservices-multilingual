syntax = "proto3";
package cafe.realtime.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/realtime/generated/cafe/realtime/v1;realtimev1";

message Selection {
  string offer_code = 1;
  string name = 2;
  int64 minor = 3;
}

message Line {
  string id = 1;
  Selection selection = 2;
  int32 quantity = 3;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string edition_id = 3;
  string currency = 4;
  string status = 5;
  repeated Line lines = 6;
}
