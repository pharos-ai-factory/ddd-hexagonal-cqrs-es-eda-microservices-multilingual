syntax = "proto3";
package cafe.loyalty.requests.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/requests/generated/cafe/requests/v1/contexts/loyalty;loyaltyv1";

import "cafe/requests/v1/common.proto";

message ListAccounts {
  cafe.requests.v1.PageRequest page = 1;
}

message GetAccount {
  string id = 1;
}

message ListRewards {
  cafe.requests.v1.PageRequest page = 1;
}

message GetReward {
  string id = 1;
}
