syntax = "proto3";
package cafe.collection.requests.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/requests/generated/cafe/requests/v1/contexts/collection;collectionv1";

import "cafe/requests/v1/common.proto";

import "cafe/requests/v1/validation.proto";

message ListPickups {
  option (cafe.requests.v1.contract) = { owner: "collection" visibility: PUBLIC };
  cafe.requests.v1.PageRequest page = 1;
}

message GetPickup {
  option (cafe.requests.v1.contract) = { owner: "collection" visibility: PUBLIC };
  string id = 1;
}
