syntax = "proto3";
package cafe.realtime.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/realtime/generated/cafe/realtime/v1;realtimev1";

import "cafe/realtime/v1/contexts/menu/menu_snapshots.proto";
import "cafe/realtime/v1/contexts/ordering/ordering_snapshots.proto";
import "cafe/realtime/v1/contexts/preparation/preparation_snapshots.proto";
import "cafe/realtime/v1/contexts/collection/collection_snapshots.proto";
import "cafe/realtime/v1/contexts/loyalty/loyalty_snapshots.proto";
import "cafe/realtime/v1/contexts/communication/communication_snapshots.proto";

// Browser messages have their own contract, independently of domain delivery.
// Revision orders one aggregate; Centrifugo epoch/offset orders channel history.
message Publication {
  string event_id = 1;
  uint32 contract_version = 2;
  string context = 3;
  string aggregate_kind = 4;
  string aggregate_id = 5;
  uint64 revision = 6;
  DeliveryTarget target = 7;
  oneof snapshot {
    Drink drink = 10;
    Edition edition = 11;
    Order order = 12;
    Ticket ticket = 13;
    Pickup pickup = 14;
    Account account = 15;
    Reward reward = 16;
    Notification notification = 17;
    OperationRejected operation_rejected = 18;
  }
}

// The application contract defines delivery targets. Publishers never construct
// Centrifugo channels; the authorised gateway derives one from this value.
message DeliveryTarget {
  oneof target {
    string context = 1;
    string principal = 2;
  }
}

// A durable application outcome. Its identity is the command, independently of root revision.
message OperationRejected {
  string command_id = 1;
  string correlation_id = 2;
  string code = 3;
  string message = 4;
}
