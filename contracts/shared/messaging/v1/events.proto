syntax = "proto3";
package cafe.v1;
option go_package = "github.com/pharos-ai-factory/ddd-hexagonal-cqrs-es-eda-microservices-multilingual/services/storefront/contracts/events/generated/cafe/v1;cafev1";

// Technical envelope. Context-owned contracts define and type the payload bytes.
message Event {
  string id = 1;
  string name = 2;
  string context = 3;
  string visibility = 4;
  uint32 contract_version = 5;
  string aggregate_kind = 6;
  string aggregate_id = 7;
  uint64 aggregate_version = 8;
  string correlation_id = 9;
  string causation_id = 10;
  string occurred_at = 11;
  bytes payload = 12;
}
