x-realtime: &realtime
  CENTRIFUGO_API_URL: http://centrifugo:9000
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MENU_DB_PASSWORD: ${MENU_DB_PASSWORD}
      ORDERING_DB_PASSWORD: ${ORDERING_DB_PASSWORD}
      PREPARATION_DB_PASSWORD: ${PREPARATION_DB_PASSWORD}
      COLLECTION_DB_PASSWORD: ${COLLECTION_DB_PASSWORD}
      LOYALTY_DB_PASSWORD: ${LOYALTY_DB_PASSWORD}
      COMMUNICATION_DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD}
    ports: ["127.0.0.1:${PG_PORT}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-reference.sh:ro
      - ../contracts/persistence:/reference:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cafe_communication"]
      interval: 2s
      timeout: 2s
      retries: 40
  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: administrator
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: reference
    ports: ["127.0.0.1:${AMQP_PORT}:5672", "127.0.0.1:${BROKER_HTTP_PORT}:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_running]
      interval: 3s
      timeout: 5s
      retries: 40
  valkey:
    image: valkey/valkey:8.1.3-alpine
    entrypoint: [/bin/sh, /reference/start.sh]
    environment:
      SESSION_PASSWORD: ${SESSION_PASSWORD}
      REALTIME_REDIS_PASSWORD: ${REALTIME_REDIS_PASSWORD}
    volumes: ["valkey-data:/data", "./valkey/start.sh:/reference/start.sh:ro"]
    healthcheck:
      test: [CMD-SHELL, "valkey-cli --user sessions --pass $${SESSION_PASSWORD} --no-auth-warning ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  centrifugo:
    image: centrifugo/centrifugo:v6.9.1
    command: [centrifugo, --config=/etc/centrifugo/config.json]
    environment:
      CENTRIFUGO_ENGINE_REDIS_ADDRESS: redis://realtime:${REALTIME_REDIS_PASSWORD}@valkey:6379/0
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_VAR_CONNECT_PROXY_SECRET: ${CONNECT_PROXY_SECRET}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: "http://localhost:${WEB_PORT} http://127.0.0.1:${WEB_PORT}"
    ports: ["127.0.0.1:${REALTIME_ADMIN_PORT}:9000"]
    volumes: ["./centrifugo/config.json:/etc/centrifugo/config.json:ro"]
    depends_on:
      valkey: {condition: service_healthy}
  topology:
    build: {context: .., dockerfile: devops/Dockerfile, args: {SERVICE: topology}}
    environment:
      APP_ENV: development
      BROKER_ADMIN_URL: amqp://administrator:${BROKER_PASSWORD}@rabbitmq:5672/reference
    depends_on:
      rabbitmq: {condition: service_healthy}
  delivery-simulator:
    build: {context: .., dockerfile: devops/Dockerfile, args: {SERVICE: simulator}}
    environment: {APP_ENV: development, API_KEY: "${DELIVERY_KEY}", DATA_DIR: /data}
    ports: ["127.0.0.1:${DELIVERY_PORT}:8080"]
    volumes: ["delivery-data:/data"]
  storefront:
    build: {context: .., dockerfile: devops/Dockerfile, args: {SERVICE: storefront}}
    environment:
      <<: *realtime
      APP_ENV: development
      API_KEY: ${STOREFRONT_API_KEY}
      MENU_DATABASE_URL: postgres://cafe_menu:${MENU_DB_PASSWORD}@postgres:5432/cafe_menu?sslmode=disable
      ORDERING_DATABASE_URL: postgres://cafe_ordering:${ORDERING_DB_PASSWORD}@postgres:5432/cafe_ordering?sslmode=disable
      MENU_BROKER_URL: amqp://cafe_menu:${MENU_BROKER_PASSWORD}@rabbitmq:5672/reference
      ORDERING_BROKER_URL: amqp://cafe_ordering:${ORDERING_BROKER_PASSWORD}@rabbitmq:5672/reference
    ports: ["127.0.0.1:${STOREFRONT_PORT}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      topology: {condition: service_completed_successfully}
  operations:
    build: {context: .., dockerfile: services/operations/Dockerfile}
    environment:
      <<: *realtime
      APP_ENV: development
      API_KEY: ${OPERATIONS_API_KEY}
      PREPARATION_DATABASE_URL: postgres://cafe_preparation:${PREPARATION_DB_PASSWORD}@postgres:5432/cafe_preparation?sslmode=disable
      COLLECTION_DATABASE_URL: postgres://cafe_collection:${COLLECTION_DB_PASSWORD}@postgres:5432/cafe_collection?sslmode=disable
      PREPARATION_BROKER_URL: amqp://cafe_preparation:${PREPARATION_BROKER_PASSWORD}@rabbitmq:5672/reference
      COLLECTION_BROKER_URL: amqp://cafe_collection:${COLLECTION_BROKER_PASSWORD}@rabbitmq:5672/reference
    ports: ["127.0.0.1:${OPERATIONS_PORT}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      topology: {condition: service_completed_successfully}
  engagement:
    build: {context: .., dockerfile: services/engagement/Dockerfile}
    environment:
      <<: *realtime
      APP_ENV: development
      API_KEY: ${ENGAGEMENT_API_KEY}
      LOYALTY_DATABASE_URL: postgres://cafe_loyalty:${LOYALTY_DB_PASSWORD}@postgres:5432/cafe_loyalty?sslmode=disable
      COMMUNICATION_DATABASE_URL: postgres://cafe_communication:${COMMUNICATION_DB_PASSWORD}@postgres:5432/cafe_communication?sslmode=disable
      LOYALTY_BROKER_URL: amqp://cafe_loyalty:${LOYALTY_BROKER_PASSWORD}@rabbitmq:5672/reference
      COMMUNICATION_BROKER_URL: amqp://cafe_communication:${COMMUNICATION_BROKER_PASSWORD}@rabbitmq:5672/reference
      DELIVERY_URL: http://delivery-simulator:8080
      DELIVERY_KEY: ${DELIVERY_KEY}
      PAUSED_CONSUMERS: ${PAUSED_CONSUMERS:-}
    ports: ["127.0.0.1:${ENGAGEMENT_PORT}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      topology: {condition: service_completed_successfully}
  api:
    build: {context: .., dockerfile: services/api/Dockerfile}
    environment:
      <<: *realtime
      APP_ENV: development
      API_KEY: ${API_KEY}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD}
      CONNECT_PROXY_SECRET: ${CONNECT_PROXY_SECRET}
      VALKEY_ADDRESS: valkey:6379
      SESSION_PASSWORD: ${SESSION_PASSWORD}
      WEB_ORIGINS: "http://localhost:${WEB_PORT},http://127.0.0.1:${WEB_PORT}"
      STOREFRONT_URL: http://storefront:8080
      OPERATIONS_URL: http://operations:8080
      ENGAGEMENT_URL: http://engagement:8080
      STOREFRONT_API_KEY: ${STOREFRONT_API_KEY}
      OPERATIONS_API_KEY: ${OPERATIONS_API_KEY}
      ENGAGEMENT_API_KEY: ${ENGAGEMENT_API_KEY}
    ports: ["127.0.0.1:${API_PORT}:8080"]
    depends_on:
      valkey: {condition: service_healthy}
  web:
    build: {context: .., dockerfile: services/web/Dockerfile}
  ingress:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${WEB_PORT}:8080"]
    volumes: ["./ingress/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, web, centrifugo]
volumes:
  postgres-data:
  rabbitmq-data:
  delivery-data:
  valkey-data:
