map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  resolver 127.0.0.11 valid=2s ipv6=off;
  client_max_body_size 64k;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_http_version 1.1;
  location /api/v1/ { set $api http://api:8080; proxy_pass $api; }
  location /auth/ { set $api http://api:8080; proxy_pass $api; }
  location = /connection/websocket {
    set $realtime http://centrifugo:8000;
    proxy_pass $realtime;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
  location = /healthz { return 200 'ready'; }
  location / { set $web http://web:3000; proxy_pass $web; }
}
